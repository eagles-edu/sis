<svg viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <style>
        :root, .palette0 {color: currentColor;
            --color0: #fff;
            --color1: #000;
        }
