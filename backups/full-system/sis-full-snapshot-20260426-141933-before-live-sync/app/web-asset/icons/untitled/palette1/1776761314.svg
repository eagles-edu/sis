<svg color="#dadada" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <g fill="currentColor" stroke-width="0" transform="scale(0.666667)">
    <animateTransform attributeName="transform" dur="3s" repeatCount="indefinite" type="rotate" values="0 12 12; 360 12 12"></animateTransform>
    <ellipse cx="12" cy="4" rx="2" ry="2"><animate attributeName="ry" dur="3s" repeatCount="indefinite" values="4; 2; 2; 2; 2; 4"></animate></ellipse>
    <ellipse cx="12" cy="4" rx="2" ry="2" transform="rotate(45 12 12)"><animate attributeName="ry" dur="3s" repeatCount="indefinite" values="4; 2; 2; 2; 2; 4"></animate></ellipse>
    <ellipse cx="12" cy="4" rx="2" ry="2" transform="rotate(90 12 12)"><animate attributeName="ry" dur="3s" repeatCount="indefinite" values="4; 2; 2; 2; 2; 4"></animate></ellipse>
    <ellipse cx="12" cy="4" rx="2" ry="2" transform="rotate(135 12 12)"><animate attributeName="ry" dur="3s" repeatCount="indefinite" values="4; 2; 2; 2; 2; 4"></animate></ellipse>
    <ellipse cx="12" cy="4" rx="2" ry="2" transform="rotate(180 12 12)"><animate attributeName="ry" dur="3s" repeatCount="indefinite" values="4; 2; 2; 2; 2; 4"></animate></ellipse>
    <ellipse cx="12" cy="4" rx="2" ry="2" transform="rotate(-135 12 12)"><animate attributeName="ry" dur="3s" repeatCount="indefinite" values="4; 2; 2; 2; 2; 4"></animate></ellipse>
    <ellipse cx="12" cy="4" rx="2" ry="2" transform="rotate(-90 12 12)"><animate attributeName="ry" dur="3s" repeatCount="indefinite" values="4; 2; 2; 2; 2; 4"></animate></ellipse>
    <ellipse cx="12" cy="4" rx="2" ry="2" transform="rotate(-45 12 12)"><animate attributeName="ry" dur="3s" repeatCount="indefinite" values="4; 2; 2; 2; 2; 4"></animate></ellipse>
  </g>
</svg>