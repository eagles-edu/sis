<svg color="#dadada" fill="currentColor" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <g transform="scale(0.666667)">
    <animateTransform attributeName="transform" dur="5s" repeatCount="indefinite" type="rotate" values="0 12 12; 360 12 12"></animateTransform>
    <ellipse cx="12" cy="5" rx="2" ry="5"><animateTransform attributeName="transform" dur="2s" repeatCount="indefinite" type="rotate" values="360 12 5; 0 12 5"></animateTransform></ellipse>
    <g transform="rotate(120 12 12)">
      <ellipse cx="12" cy="5" rx="2" ry="5"><animateTransform attributeName="transform" dur="2s" repeatCount="indefinite" type="rotate" values="360 12 5; 0 12 5"></animateTransform></ellipse>
    </g>
    <g transform="rotate(-120 12 12)">
      <ellipse cx="12" cy="5" rx="2" ry="5"><animateTransform attributeName="transform" dur="2s" repeatCount="indefinite" type="rotate" values="360 12 5; 0 12 5"></animateTransform></ellipse>
    </g>
  </g>
</svg>