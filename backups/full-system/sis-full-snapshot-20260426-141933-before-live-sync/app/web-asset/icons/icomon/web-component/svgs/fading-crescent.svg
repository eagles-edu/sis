<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <radialGradient id="gradient1">
            <stop offset="65%" stop-color="var(--color1, #000)" />
            <stop offset="100%" stop-color="var(--color0, #fff)" />
        </radialGradient>
        <linearGradient id="gradient0" gradientTransform="rotate(90 0.25 0.25)">
            <stop offset="0%" stop-color="currentColor" />
            <stop offset="85%" stop-color="currentColor" stop-opacity="0" />
        </linearGradient>
        <mask id="m" color="#000">
            <rect fill="url(#gradient1)" width="24" height="24" x="0" y="0" />
        </mask>
    </defs>
    <circle stroke-width="5" fill="url(#gradient0)" cx="12" cy="12" mask="url(#m)" r="12">
        <animateTransform attributeName="transform" dur="1s" repeatCount="indefinite" type="rotate" values="0 12 12;360 12 12" />
    </circle>
</svg>