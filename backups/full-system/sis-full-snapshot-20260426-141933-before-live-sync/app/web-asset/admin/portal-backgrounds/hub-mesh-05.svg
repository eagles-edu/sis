<svg xmlns="http://www.w3.org/2000/svg" id="mesh-gradient" 
	    width="1000" height="500" viewBox="0 0 1000 500" >
	        <defs>
	            <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
	                <feGaussianBlur stdDeviation="159" />
	            </filter>
	            <filter id="noise" x="0" y="0" width="100%" height="100%">
				<feTurbulence type="fractalNoise" baseFrequency="1" octaves="3" result="turbulence" stitchTiles="stitch" />
				<feBlend in="SourceGraphic" in2="turbulence" mode="overlay" />
			</filter>
	        </defs>
	        <rect id="background" width="100%" height="100%" fill="#E8EEFF" />
	        <g id="swatches" width="1000" height="500" filter="url(#blur)"><rect x="721.7779030078568" y="2.911864369103398" width="543.2629376303119" height="547.3060566167629" fill="#002768" /><rect x="46.64172179646437" y="149.40062989788146" width="500.2304533569867" height="444.0716583862521" fill="#FFFFFF" /><rect x="260.9133576965947" y="-158.32257980334674" width="520.623446503802" height="376.7794292682685" fill="#E0162B" /><rect x="389.078237450091" y="102.7952337252263" width="305.912071145006" height="496.00512217994117" fill="#FFFFFF" /></g>
	    	<rect x="0" y="0" width="1000" height="500" 
	    	style="mix-blend-mode: soft-light; filter: url(#noise); opacity: 52%"></rect>
    	</svg>