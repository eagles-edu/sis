server {
    listen 80;
    listen [::]:80;
    server_name moodle.eagles.edu.vn www.moodle.eagles.edu.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /home/moodle.eagles.edu.vn/app;
        default_type "text/plain";
        allow all;
    }

    return 301 https://moodle.eagles.edu.vn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moodle.eagles.edu.vn www.moodle.eagles.edu.vn;

    root /home/moodle.eagles.edu.vn/app;
    index index.php index.html;

    ssl_certificate /root/.acme.sh/moodle.eagles.edu.vn_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/moodle.eagles.edu.vn_ecc/moodle.eagles.edu.vn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header HSTS "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 128M;

    access_log /var/log/nginx/moodle_eagles_edu_access_443.log;
    error_log /var/log/nginx/moodle_eagles_edu_error_443.log warn;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /home/moodle.eagles.edu.vn/app;
        default_type "text/plain";
        allow all;
    }

    location ~ ^/(config\.php|composer\.(json|lock)|phpunit\.xml|install\.xml|upgrade\.txt|README\.md|TRADEMARK\.txt|COPYING\.txt)$ {
        deny all;
    }

    location ~ ^/(vendor|node_modules|\.git|\.hg|\.svn|tests|behat|fixtures)/ {
        deny all;
    }

    location ~ [^/]\.php(?:/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
