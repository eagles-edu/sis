<svg xmlns="http://www.w3.org/2000/svg" id="mesh-gradient" 
	    width="1000" height="500" viewBox="0 0 1000 500" >
	        <defs>
	            <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
	                <feGaussianBlur stdDeviation="164" />
	            </filter>
	            <filter id="noise" x="0" y="0" width="100%" height="100%">
				<feTurbulence type="fractalNoise" baseFrequency="1" octaves="3" result="turbulence" stitchTiles="stitch" />
				<feBlend in="SourceGraphic" in2="turbulence" mode="overlay" />
			</filter>
	        </defs>
	        <rect id="background" width="100%" height="100%" fill="#E8EEFF" />
	        <g id="swatches" width="1000" height="500" filter="url(#blur)"><rect x="149.65929035864244" y="-47.21300628909415" width="440.0196613791763" height="478.9532475893802" fill="#E0162B" /><rect x="456.39601369858445" y="-49.208689115738395" width="457.2964735166489" height="369.8175788925534" fill="#00AEFF" /><rect x="330.4585273939185" y="191.2671407245073" width="416.265726208762" height="380.7536111828836" fill="#FFFFFF" /></g>
	    	<rect x="0" y="0" width="1000" height="500" 
	    	style="mix-blend-mode: soft-light; filter: url(#noise); opacity: 49%"></rect>
    	</svg>