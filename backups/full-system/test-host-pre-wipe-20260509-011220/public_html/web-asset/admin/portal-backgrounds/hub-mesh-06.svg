<svg xmlns="http://www.w3.org/2000/svg" id="mesh-gradient" 
	    width="1000" height="500" viewBox="0 0 1000 500" >
	        <defs>
	            <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
	                <feGaussianBlur stdDeviation="159" />
	            </filter>
	            <filter id="noise" x="0" y="0" width="100%" height="100%">
				<feTurbulence type="fractalNoise" baseFrequency="1" octaves="3" result="turbulence" stitchTiles="stitch" />
				<feBlend in="SourceGraphic" in2="turbulence" mode="overlay" />
			</filter>
	        </defs>
	        <rect id="background" width="100%" height="100%" fill="#E8EEFF" />
	        <g id="swatches" width="1000" height="500" filter="url(#blur)"><rect x="771.2068705719862" y="-230.6455942633599" width="304.0606029860624" height="585.0644568268943" fill="#002768" /><rect x="196.34648326636147" y="-60.815493278793156" width="585.1703961302183" height="344.4480811072852" fill="#FFFFFF" /><rect x="2.1804069165101225" y="296.58350607483834" width="381.63720233309715" height="313.0853457583346" fill="#E0162B" /><rect x="-79.74849108738081" y="-140.007478807104" width="580.7975658643838" height="340.97296935688166" fill="#FFFFFF" /></g>
	    	<rect x="0" y="0" width="1000" height="500" 
	    	style="mix-blend-mode: soft-light; filter: url(#noise); opacity: 52%"></rect>
    	</svg>