<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Animated maintenance loop</title>
  <desc id="desc">A left conveyor feeds code blocks to a right crane arm that picks them up and places them in a stack in an endless loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f9fbff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf3ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f66ff"/>
      <stop offset="1" stop-color="#15306d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd686"/>
      <stop offset="1" stop-color="#ea8a2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10265b" flood-opacity=".12"/>
    </filter>
    <path id="route" d="M250 355 C370 350 460 345 545 318 C625 292 670 255 748 234 C816 216 866 220 904 238 C927 249 932 267 923 283 C912 304 892 318 862 330 C819 348 772 358 714 362 C618 368 466 366 250 355"/>
  </defs>
  <style>
    .gear { transform-origin: center; animation: spin 4s linear infinite; }
    .gear-slow { transform-origin: center; animation: spin 6s linear infinite; }
    .handle { transform-origin: center; animation: spin 2.3s linear infinite; }
    .boom { transform-origin: 760px 168px; animation: swing 5.8s ease-in-out infinite; }
    .block { animation: travel 5.8s linear infinite; }
    .pickup { animation: pulse 1.6s ease-in-out infinite; }
    .belt { stroke-dasharray: 14 12; animation: dash 1.4s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes swing {
      0%, 18% { transform: rotate(-22deg); }
      34% { transform: rotate(10deg); }
      52% { transform: rotate(20deg); }
      72% { transform: rotate(8deg); }
      88% { transform: rotate(-8deg); }
      100% { transform: rotate(-22deg); }
    }
    @keyframes travel {
      0%, 18% { opacity: 0; transform: translate(0,0); }
      22% { opacity: 1; }
      42% { opacity: 1; transform: translate(340px, -6px); }
      56% { opacity: 1; transform: translate(520px, -80px); }
      72% { opacity: 1; transform: translate(650px, -120px); }
      84% { opacity: .2; transform: translate(700px, -120px); }
      100% { opacity: 0; transform: translate(0,0); }
    }
    @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @keyframes dash { to { stroke-dashoffset: -26; } }
    @media (prefers-reduced-motion: reduce) {
      .gear, .gear-slow, .handle, .boom, .block, .pickup, .belt { animation: none !important; }
    }
  </style>

  <rect width="1200" height="540" rx="34" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="64" y="64" width="1072" height="412" rx="28" fill="url(#panel)" stroke="#c8d8ff" stroke-width="2"/>
  </g>

  <!-- Left conveyor machine -->
  <g transform="translate(110 242)">
    <rect x="0" y="0" width="420" height="160" rx="24" fill="#edf3ff" stroke="#c7d7ff" stroke-width="2"/>
    <rect x="22" y="22" width="148" height="34" rx="12" fill="url(#blue)"/>
    <rect x="182" y="22" width="78" height="34" rx="12" fill="#dbe6ff"/>
    <rect x="272" y="22" width="100" height="34" rx="12" fill="#dbe6ff"/>

    <rect x="24" y="74" width="372" height="20" rx="10" fill="#dbe6ff"/>
    <rect x="24" y="102" width="372" height="20" rx="10" fill="#dbe6ff"/>
    <rect x="24" y="130" width="372" height="8" rx="4" fill="#c9d7f4"/>

    <g transform="translate(34 74)">
      <rect x="0" y="0" width="92" height="26" rx="8" fill="#2b60e8"/>
      <path d="M12 8h16M12 18h30M50 8h16" stroke="#eff5ff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="block" transform="translate(0 74)">
      <rect x="0" y="0" width="92" height="26" rx="8" fill="#1f4fb7"/>
      <path d="M12 8h16M12 18h30M50 8h16" stroke="#eff5ff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="block" style="animation-delay:-1.9s" transform="translate(0 74)">
      <rect x="0" y="0" width="92" height="26" rx="8" fill="#3a73ff"/>
      <path d="M12 8h16M12 18h30M50 8h16" stroke="#eff5ff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="block" style="animation-delay:-3.8s" transform="translate(0 74)">
      <rect x="0" y="0" width="92" height="26" rx="8" fill="#2358d4"/>
      <path d="M12 8h16M12 18h30M50 8h16" stroke="#eff5ff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g transform="translate(60 40)">
      <circle class="gear" cx="0" cy="0" r="22" fill="#f7faff" stroke="#95a8e8" stroke-width="6"/>
      <circle cx="0" cy="0" r="7" fill="url(#blue)"/>
      <path d="M0 -30v18M0 12v18M-30 0h18M12 0h18" stroke="#95a8e8" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="translate(124 44)">
      <circle class="gear-slow" cx="0" cy="0" r="18" fill="#f7faff" stroke="#95a8e8" stroke-width="6"/>
      <circle cx="0" cy="0" r="6" fill="url(#blue)"/>
      <path d="M0 -24v14M0 10v14M-24 0h14M10 0h14" stroke="#95a8e8" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="translate(274 42)">
      <circle class="handle" cx="0" cy="0" r="12" fill="#f7faff" stroke="#95a8e8" stroke-width="5"/>
      <rect x="-2" y="-24" width="4" height="24" rx="2" fill="#95a8e8"/>
    </g>
  </g>

  <!-- Right crane machine -->
  <g transform="translate(704 150)">
    <rect x="0" y="0" width="350" height="252" rx="28" fill="#eef4ff" stroke="#c8d8ff" stroke-width="2"/>
    <rect x="26" y="24" width="122" height="34" rx="12" fill="url(#blue)"/>
    <rect x="160" y="24" width="70" height="34" rx="12" fill="#dbe6ff"/>
    <rect x="242" y="24" width="82" height="34" rx="12" fill="#dbe6ff"/>

    <g transform="translate(56 40)">
      <circle class="gear" cx="0" cy="0" r="23" fill="#f7faff" stroke="#95a8e8" stroke-width="6"/>
      <circle cx="0" cy="0" r="7" fill="url(#blue)"/>
      <path d="M0 -30v18M0 12v18M-30 0h18M12 0h18" stroke="#95a8e8" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g class="boom">
      <path d="M168 92 h106" stroke="url(#blue)" stroke-width="18" stroke-linecap="round"/>
      <path d="M250 92 l52 56" stroke="url(#blue)" stroke-width="18" stroke-linecap="round"/>
      <circle cx="168" cy="92" r="18" fill="#f7faff" stroke="#95a8e8" stroke-width="6"/>
      <circle cx="168" cy="92" r="6" fill="url(#blue)"/>
      <g>
        <rect x="294" y="134" width="16" height="16" rx="5" fill="#f6faff" stroke="#95a8e8" stroke-width="3"/>
        <path d="M302 150 l0 18M302 150 l-12 14M302 150 l12 14" stroke="#95a8e8" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g class="pickup" transform="translate(290 128)">
        <circle cx="0" cy="0" r="10" fill="none" stroke="#ea8a2d" stroke-width="4"/>
      </g>
    </g>

    <rect x="250" y="172" width="60" height="22" rx="7" fill="#f7faff" stroke="#c8d8ff" stroke-width="2"/>
    <rect x="250" y="198" width="70" height="22" rx="7" fill="#dbe6ff" stroke="#c8d8ff" stroke-width="2"/>
    <rect x="250" y="224" width="80" height="22" rx="7" fill="#c9d7f4" stroke="#c8d8ff" stroke-width="2"/>
    <rect x="250" y="250" width="90" height="22" rx="7" fill="#b9c8ef" stroke="#c8d8ff" stroke-width="2"/>
  </g>

  <!-- Moving code block from conveyor to stack -->
  <g class="block" transform="translate(0 0)">
    <rect x="-46" y="-14" width="92" height="28" rx="8" fill="#ffffff" stroke="#90a6eb" stroke-width="3"/>
    <path d="M-28 -3h18M-28 7h34M10 -3h18" stroke="#2e63ff" stroke-width="3" stroke-linecap="round"/>
    <animateMotion dur="5.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route"/>
    </animateMotion>
    <animate attributeName="opacity" dur="5.8s" repeatCount="indefinite" values="0;0;1;1;1;0.3;0" keyTimes="0;0.18;0.24;0.5;0.72;0.88;1"/>
  </g>

  <!-- Simple pickup glow -->
  <g class="pickup" transform="translate(720 344)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ea8a2d" stroke-width="4"/>
  </g>

  <!-- floor -->
  <path d="M120 424c120-14 240-22 360-22s240 8 360 22" fill="none" stroke="#d3def3" stroke-width="8" stroke-linecap="round"/>

</svg>
