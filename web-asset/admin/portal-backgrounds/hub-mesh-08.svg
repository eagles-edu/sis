<svg xmlns="http://www.w3.org/2000/svg" id="mesh-gradient" 
	    width="1000" height="500" viewBox="0 0 1000 500" >
	        <defs>
	            <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
	                <feGaussianBlur stdDeviation="133" />
	            </filter>
	            <filter id="noise" x="0" y="0" width="100%" height="100%">
				<feTurbulence type="fractalNoise" baseFrequency="1" octaves="3" result="turbulence" stitchTiles="stitch" />
				<feBlend in="SourceGraphic" in2="turbulence" mode="overlay" />
			</filter>
	        </defs>
	        <rect id="background" width="100%" height="100%" fill="#E8EEFF" />
	        <g id="swatches" width="1000" height="500" filter="url(#blur)"><rect x="684.2046745315829" y="194.93754000943682" width="392.99714158106224" height="372.9134082422088" fill="#E0162B" /><rect x="469.1790333675418" y="146.60840972069678" width="323.860426070168" height="529.5592365101137" fill="#FFFFFF" /><rect x="-138.16365571613187" y="57.05104433812818" width="392.56524485316027" height="595.0837566935288" fill="#002768" /><rect x="-160.67846967913653" y="283.4480514360841" width="451.7294730879863" height="383.21642632610417" fill="#FFFFFF" /></g>
	    	<rect x="0" y="0" width="1000" height="500" 
	    	style="mix-blend-mode: soft-light; filter: url(#noise); opacity: 74%"></rect>
    	</svg>