<svg xmlns="http://www.w3.org/2000/svg" id="mesh-gradient" 
	    width="1000" height="500" viewBox="0 0 1000 500" >
	        <defs>
	            <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
	                <feGaussianBlur stdDeviation="182" />
	            </filter>
	            <filter id="noise" x="0" y="0" width="100%" height="100%">
				<feTurbulence type="fractalNoise" baseFrequency="1" octaves="3" result="turbulence" stitchTiles="stitch" />
				<feBlend in="SourceGraphic" in2="turbulence" mode="overlay" />
			</filter>
	        </defs>
	        <rect id="background" width="100%" height="100%" fill="#FFFFFF" />
	        <g id="swatches" width="1000" height="500" filter="url(#blur)"><rect x="-183.046964364655" y="-282.3361644446381" width="482.8932600991413" height="893.510688638256" fill="#FFFFFF" /><rect x="372.1999837138848" y="-103.41532900159723" width="326.2129595436155" height="573.7654853673138" fill="#F6182F" /><rect x="76.10267705761788" y="97.16249491626519" width="458.3715449154412" height="353.5880625359" fill="#0047BE" /><rect x="330.5122653278736" y="108.38572286731812" width="347.2627501636941" height="370.64581504312605" fill="#FFFFFF" /></g>
	    	<rect x="0" y="0" width="1000" height="500" 
	    	style="mix-blend-mode: soft-light; filter: url(#noise); opacity: 69%"></rect>
    	</svg>