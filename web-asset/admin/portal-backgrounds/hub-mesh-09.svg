<svg xmlns="http://www.w3.org/2000/svg" id="mesh-gradient" 
	    width="1000" height="500" viewBox="0 0 1000 500" >
	        <defs>
	            <filter id="blur" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
	                <feGaussianBlur stdDeviation="133" />
	            </filter>
	            <filter id="noise" x="0" y="0" width="100%" height="100%">
				<feTurbulence type="fractalNoise" baseFrequency="1" octaves="3" result="turbulence" stitchTiles="stitch" />
				<feBlend in="SourceGraphic" in2="turbulence" mode="overlay" />
			</filter>
	        </defs>
	        <rect id="background" width="100%" height="100%" fill="#E8EEFF" />
	        <g id="swatches" width="1000" height="500" filter="url(#blur)"><rect x="173.83889115651075" y="45.12271100687366" width="331.4824485497298" height="414.3711526046704" fill="#E0162B" /><rect x="192.61721040320788" y="-200.99492338133916" width="500.6880849887268" height="460.844264566957" fill="#FFFFFF" /><rect x="772.2699539745469" y="86.62415520887225" width="446.6237686736065" height="522.8750851781188" fill="#FFFFFF" /><rect x="665.6159758320879" y="-22.76482641785242" width="333.6836076274955" height="550.34929485447" fill="#002768" /></g>
	    	<rect x="0" y="0" width="1000" height="500" 
	    	style="mix-blend-mode: soft-light; filter: url(#noise); opacity: 74%"></rect>
    	</svg>