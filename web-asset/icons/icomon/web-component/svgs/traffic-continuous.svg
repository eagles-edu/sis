<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <circle opacity="0.5" cx="3" cy="12" r="3">
        <animate id="one" attributeName="opacity" dur="1.8s" repeatCount="indefinite" values="0; 1; 0" />
        <animate attributeName="cx" dur="1.8s" repeatCount="indefinite" values="3; 21" />
    </circle>
    <circle opacity="0" cx="3" cy="12" r="3">
        <animate attributeName="opacity" begin="one.begin+0.6s" dur="1.8s" repeatCount="indefinite" values="0; 1; 0" />
        <animate attributeName="cx" begin="one.begin+0.6s" dur="1.8s" repeatCount="indefinite" values="3; 21" />
    </circle>
    <circle opacity="0" cx="3" cy="12" r="3">
        <animate attributeName="opacity" begin="one.begin+1.2s" dur="1.8s" repeatCount="indefinite" values="0; 1; 0" />
        <animate attributeName="cx" begin="one.begin+1.2s" dur="1.8s" repeatCount="indefinite" values="3; 21" />
    </circle>
</svg>