<svg color="#272727" fill="currentColor" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="gradient0">
      <stop offset="25%"></stop>
      <stop offset="100%" stop-color="#fff"></stop>
    </linearGradient>
    <mask color="#000" id="m">
      <rect fill="url(#gradient0)" height="10.666667" width="10.666667" x="0" y="0"></rect>
    </mask>
  </defs>
  <g mask="url(#m)" transform="scale(0.666667)">
    <animateTransform attributeName="transform" dur="3s" repeatCount="indefinite" type="rotate" values="0 12 12; 360 12 12"></animateTransform>
    <g>
      <animateTransform attributeName="transform" dur="2s" repeatCount="indefinite" type="rotate" values="360 12 12; 0 12 12"></animateTransform>
      <circle cx="12" cy="2" r="2"></circle>
      <circle cx="12" cy="2" r="2" transform="rotate(30 12 12)"></circle>
      <circle cx="12" cy="2" r="2" transform="rotate(60 12 12)"></circle>
      <circle cx="12" cy="2" r="2" transform="rotate(90 12 12)"></circle>
      <circle cx="12" cy="2" r="2" transform="rotate(120 12 12)"></circle>
      <circle cx="12" cy="2" r="2" transform="rotate(150 12 12)"></circle>
      <circle cx="12" cy="2" r="2" transform="rotate(180 12 12)"></circle>
      <circle cx="12" cy="2" r="2" transform="rotate(-150 12 12)"></circle>
      <circle cx="12" cy="2" r="2" transform="rotate(-120 12 12)"></circle>
      <circle cx="12" cy="2" r="2" transform="rotate(-90 12 12)"></circle>
      <circle cx="12" cy="2" r="2" transform="rotate(-60 12 12)"></circle>
      <circle cx="12" cy="2" r="2" transform="rotate(-30 12 12)"></circle>
    </g>
  </g>
</svg>