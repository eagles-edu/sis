global:
  resolve_timeout: 5m

route:
  receiver: sis-slack
  group_by: [alertname, instance, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: sis-slack
      matchers:
        - severity="critical"
      repeat_interval: 30m

receivers:
  - name: sis-slack
    slack_configs:
      - api_url_file: /run/secrets/slack_webhook_url
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, instance, job]
