global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: blackbox-test-mirror
    scrape_interval: 60s
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://test.eagles.edu.vn/admin
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # These jobs intentionally have no targets until tools/monitoring-diagnostics.sh
  # enables the corresponding low-overhead diagnostic exporter.
  - job_name: process-diagnostics
    file_sd_configs:
      - files: [/etc/prometheus/diagnostic-targets/process.json]

  - job_name: redis-diagnostics
    file_sd_configs:
      - files: [/etc/prometheus/diagnostic-targets/redis.json]

  - job_name: litespeed-diagnostics
    file_sd_configs:
      - files: [/etc/prometheus/diagnostic-targets/litespeed.json]
