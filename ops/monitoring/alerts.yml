groups:
  - name: sis-engagement-workflows-dev
    rules:
      - alert: DevEngagementMonitorStale
        expr: absent(sis_engagement_workflow_last_check_timestamp_seconds{environment="dev"}) or time() - sis_engagement_workflow_last_check_timestamp_seconds{environment="dev"} > 180
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Dev engagement workflow monitor has not reported for three minutes

      - alert: DevEngagementReportApiUnavailable
        expr: sis_engagement_report_api_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Authenticated dev engagement reporting API check failed

      - alert: DevEngagementWebhookProcessingStale
        expr: sis_engagement_webhook_unprocessed_events{environment="dev"} > 0 and sis_engagement_webhook_oldest_unprocessed_age_seconds{environment="dev"} > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev email engagement webhook processing is more than five minutes behind

      - alert: DevEngagementSideEffectFailures
        expr: sis_async_side_effect_failed_jobs_24h{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev async side-effect jobs have failed in the last 24 hours

      - alert: DevEngagementSideEffectProcessingStale
        expr: sis_async_side_effect_stale_processing_jobs{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A dev async side-effect job has been processing for more than five minutes

      - alert: DevEngagementWorkerStale
        expr: sis_async_side_effect_worker_stale{environment="dev"} == 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Dev async side-effect worker heartbeat is missing or stale

      - alert: DevEngagementWorkerPollFailed
        expr: sis_async_side_effect_worker_last_poll_success{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev async side-effect worker poll failed

  - name: sis-parent-profile-workflow
    rules:
      - alert: DevParentProfileWorkflowCheckFailed
        expr: sis_parent_profile_workflow_check_success{environment="dev"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Synthetic parent profile workflow monitor failed in dev

  - name: sis-library-workflow-dev
    rules:
      - alert: DevLibraryWorkflowMonitorStale
        expr: absent(sis_library_workflow_last_check_timestamp_seconds{environment="dev"}) or time() - sis_library_workflow_last_check_timestamp_seconds{environment="dev"} > 600
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Dev Library workflow monitor has not reported for ten minutes

      - alert: DevLibraryAccessUnavailable
        expr: sis_library_student_access_available{environment="dev"} == 0 or sis_library_admin_access_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Authenticated dev Library access check failed

      - alert: DevLibrarySaveCheckFailed
        expr: sis_library_save_check_success{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Synthetic dev Library save check failed

      - alert: DevLibraryReviewCheckFailed
        expr: sis_library_review_check_success{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Synthetic dev Library review or student result check failed

      - alert: DevLibraryOldReviewQueue
        expr: sis_library_oldest_open_review_age_seconds{environment="dev"} > 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A dev Library contribution has waited for review for more than 24 hours

      - alert: DevLibraryDependencyUnavailable
        expr: sis_library_api_available{environment="dev"} == 0 or sis_library_database_available{environment="dev"} == 0 or sis_library_redis_available{environment="dev"} == 0 or sis_library_cmu_dictionary_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A required dev Library dependency is unavailable

      - alert: DevLibrarySyntheticCleanupFailed
        expr: sis_library_cleanup_success{environment="dev"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Dev Library workflow monitor could not clean up its synthetic record

  - name: sis-test-mirror
    rules:
      - alert: TestMirrorPublicAdminDown
        expr: probe_success{job="blackbox-test-mirror"} < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Test mirror admin page is unavailable

      - alert: HostCpuHigh
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m]))) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage is above 85 percent

      - alert: HostMemoryLow
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host available memory is below 15 percent
