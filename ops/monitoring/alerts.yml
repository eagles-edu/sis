groups:
  - name: sis-test-mirror
    rules:
      - alert: TestMirrorPublicAdminDown
        expr: probe_success{job="blackbox-test-mirror"} < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Test mirror admin page is unavailable

      - alert: HostCpuHigh
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m]))) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage is above 85 percent

      - alert: HostMemoryLow
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host available memory is below 15 percent
