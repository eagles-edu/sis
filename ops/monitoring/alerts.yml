groups:
  - name: sis-keepalive-check-groups-dev
    rules:
      - alert: DevKeepaliveCheckFailed
        expr: sis_keepalive_check_failure_info{environment="dev",code!="none"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A dev keep-alive check group is failing
          description: "Logical check group {{ $labels.group }} reports failure code {{ $labels.code }}."

      - alert: DevKeepaliveCheckStale
        expr: (time() - sis_keepalive_check_last_check_timestamp_seconds{environment="dev"}) > on(environment, group) group_left sis_keepalive_check_stale_after_seconds{environment="dev"} and on(environment, group) sis_keepalive_check_stale_after_seconds{environment="dev"} > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: A scheduled dev keep-alive check group is stale
          description: "Logical check group {{ $labels.group }} has not reported within its configured freshness limit."

  - name: sis-grade-feeds-dev
    rules:
      - alert: DevGradeFeedMonitorStale
        expr: absent(sis_grade_feed_monitor_last_check_timestamp_seconds{environment="dev"}) or time() - sis_grade_feed_monitor_last_check_timestamp_seconds{environment="dev"} > 900
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Dev grade and exercise-feed monitor has not reported for fifteen minutes

      - alert: DevGradeFeedDatabaseUnavailable
        expr: sis_grade_feed_database_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev grade and exercise-feed database check failed

      - alert: DevGradeFeedAdminTableUnavailable
        expr: sis_grade_feed_table_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Authenticated dev admin student table API is unavailable

      - alert: DevGradeFeedRequestMetricsMissing
        expr: sis_grade_feed_request_metrics_available{environment="dev"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Dev grade and feed request instrumentation textfile is missing

      - alert: DevGradeFeedUnmatchedBacklog
        expr: sis_grade_feed_incoming_unmatched{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev incoming exercise results remain unmatched

      - alert: DevGradeFeedRecordedFailure
        expr: sum(increase(sis_grade_feed_write_requests_total{environment="dev",status!~"2.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: An authorized dev grade write or signed exercise-feed request failed

      - alert: DevIncomingExerciseFailed
        expr: sis_grade_feed_incoming_failed{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev incoming exercise results have failed disposition

  - name: sis-attendance-dev
    rules:
      - alert: DevEnrollmentIntegrityConflict
        expr: sis_enrollment_multiple_active_records{environment="dev"} > 0 or sis_enrollment_overlapping_period_pairs{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev enrollment history contains overlapping or multiple active periods

      - alert: DevMoodleProvisioningQueueStale
        expr: sis_moodle_provisioning_oldest_due_command_age_seconds{environment="dev"} > 1800
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A due dev Moodle provisioning command has waited over thirty minutes

      - alert: DevMoodleProvisioningRejected
        expr: sis_moodle_provisioning_rejected_commands{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev Moodle provisioning has rejected commands requiring review

      - alert: DevMoodleProvisioningProcessingStale
        expr: sis_moodle_provisioning_oldest_processing_age_seconds{environment="dev"} > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A dev Moodle provisioning command has remained processing for over five minutes

      - alert: DevProfileWriteFailure
        expr: sum(increase(sis_admin_student_write_requests_total{environment="dev",route=~"POST /api/admin/students|PUT /api/admin/students/:id",status!~"2.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: An authenticated dev profile write request failed

      - alert: DevEnrollmentWriteFailure
        expr: sum(increase(sis_admin_student_write_requests_total{environment="dev",route="POST /api/admin/students/:id/enrollment",status!~"2.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: An authenticated dev enrollment write request failed

      - alert: DevAttendanceSaveFailure
        expr: sum(increase(sis_admin_student_write_requests_total{environment="dev",route=~"POST /api/admin/students/:id/attendance|DELETE /api/admin/students/:id/attendance/:recordId",status!~"2.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: An authenticated dev attendance save or delete request failed

      - alert: DevAttendanceSchoolSetupInvalid
        expr: sis_attendance_school_setup_valid{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev SIS attendance school setup is missing or invalid

      - alert: DevAttendanceReportingUnavailable
        expr: sis_attendance_reporting_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Authenticated dev attendance reporting summary is unavailable

  - name: sis-engagement-workflows-dev
    rules:
      - alert: DevEngagementMonitorStale
        expr: absent(sis_engagement_workflow_last_check_timestamp_seconds{environment="dev"}) or time() - sis_engagement_workflow_last_check_timestamp_seconds{environment="dev"} > 180
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Dev engagement workflow monitor has not reported for three minutes

      - alert: DevEngagementReportApiUnavailable
        expr: sis_engagement_report_api_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Authenticated dev engagement reporting API check failed

      - alert: DevParentAuthenticationUnavailable
        expr: sis_parent_authentication_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Exact configured dev parent account could not authenticate

      - alert: DevParentReportDashboardUnavailable
        expr: sis_parent_report_dashboard_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Authenticated dev parent report dashboard is unavailable

      - alert: DevEngagementWebhookProcessingStale
        expr: sis_engagement_webhook_unprocessed_events{environment="dev"} > 0 and sis_engagement_webhook_oldest_unprocessed_age_seconds{environment="dev"} > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev email engagement webhook processing is more than five minutes behind

      - alert: DevEngagementSideEffectFailures
        expr: sis_async_side_effect_failed_jobs_24h{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev async side-effect jobs have failed in the last 24 hours

      - alert: DevEngagementSideEffectProcessingStale
        expr: sis_async_side_effect_stale_processing_jobs{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A dev async side-effect job has been processing for more than five minutes

      - alert: DevEngagementWorkerStale
        expr: sis_async_side_effect_worker_stale{environment="dev"} == 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Dev async side-effect worker heartbeat is missing or stale

      - alert: DevEngagementWorkerPollFailed
        expr: sis_async_side_effect_worker_last_poll_success{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev async side-effect worker poll failed

      - alert: DevAnnouncementQueueStale
        expr: sis_async_announcement_oldest_queued_age_seconds{environment="dev"} > 120
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A dev announcement email has remained ready in the queue for over two minutes

      - alert: DevNotificationQueueStale
        expr: sis_notification_oldest_due_queue_age_seconds{environment="dev"} > 1800
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A due dev notification with a recipient has waited over thirty minutes

      - alert: DevNotificationDeliveryFailure
        expr: sis_notification_delivery_failure_queue_items{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev notification queue items retain a delivery error

      - alert: DevParentReportNotificationQueueStale
        expr: sis_parent_report_notification_oldest_due_age_seconds{environment="dev"} > 1800
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A due dev parent report notification has waited over thirty minutes

      - alert: DevParentReportNotificationDeliveryFailure
        expr: sis_parent_report_notification_delivery_failure_items{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev parent report notification items retain a delivery error

      - alert: DevAssignmentReminderDispatchStale
        expr: sis_assignment_reminder_stale_pending_dispatches{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A dev assignment reminder dispatch has remained pending for over five minutes

      - alert: DevAssignmentReminderDispatchFailed
        expr: sis_assignment_reminder_failed_dispatches_24h{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Dev assignment reminder dispatches have failed in the last 24 hours

  - name: sis-student-records-and-engagement-test
    rules:
      - alert: TestEngagementMonitorStale
        expr: absent(sis_engagement_workflow_last_check_timestamp_seconds{environment="test"}) or time() - sis_engagement_workflow_last_check_timestamp_seconds{environment="test"} > 180
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Test engagement workflow monitor has not reported for three minutes

      - alert: TestProfileWriteFailure
        expr: sum(increase(sis_admin_student_write_requests_total{environment="test",route=~"POST /api/admin/students|PUT /api/admin/students/:id",status!~"2.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: An authenticated test profile write request failed

      - alert: TestEnrollmentWriteFailure
        expr: sum(increase(sis_admin_student_write_requests_total{environment="test",route="POST /api/admin/students/:id/enrollment",status!~"2.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: An authenticated test enrollment write request failed

      - alert: TestEnrollmentIntegrityConflict
        expr: sis_enrollment_multiple_active_records{environment="test"} > 0 or sis_enrollment_overlapping_period_pairs{environment="test"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Test enrollment history contains overlapping or multiple active periods

      - alert: TestMoodleProvisioningQueueStale
        expr: sis_moodle_provisioning_oldest_due_command_age_seconds{environment="test"} > 1800 or sis_moodle_provisioning_oldest_processing_age_seconds{environment="test"} > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Test Moodle provisioning contains stale due or processing commands

      - alert: TestMoodleProvisioningRejected
        expr: sis_moodle_provisioning_rejected_commands{environment="test"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Test Moodle provisioning has rejected commands requiring review

      - alert: TestNotificationQueueStale
        expr: sis_notification_oldest_due_queue_age_seconds{environment="test"} > 1800 or sis_parent_report_notification_oldest_due_age_seconds{environment="test"} > 1800
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A due test notification has waited over thirty minutes

      - alert: TestNotificationDeliveryFailure
        expr: sis_notification_delivery_failure_queue_items{environment="test"} > 0 or sis_parent_report_notification_delivery_failure_items{environment="test"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Test notification queue items retain a delivery error

  - name: sis-parent-profile-workflow
    rules:
      - alert: DevParentProfileWorkflowCheckFailed
        expr: sis_parent_profile_workflow_check_success{environment="dev"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Synthetic parent profile workflow monitor failed in dev

  - name: sis-library-workflow-dev
    rules:
      - alert: DevLibraryWorkflowMonitorStale
        expr: absent(sis_library_workflow_last_check_timestamp_seconds{environment="dev"}) or time() - sis_library_workflow_last_check_timestamp_seconds{environment="dev"} > 600
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Dev Library workflow monitor has not reported for ten minutes

      - alert: DevLibraryAccessUnavailable
        expr: sis_library_student_access_available{environment="dev"} == 0 or sis_library_admin_access_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Authenticated dev Library access check failed

      - alert: DevLibrarySaveCheckFailed
        expr: sis_library_save_check_success{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Synthetic dev Library save check failed

      - alert: DevLibraryReviewCheckFailed
        expr: sis_library_review_check_success{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Synthetic dev Library review or student result check failed

      - alert: DevLibraryDefinitionSaveFailed
        expr: sis_library_definition_save_check_success{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Synthetic dev Library definition did not persist exactly

      - alert: DevLibraryDictionaryBuilderCheckFailed
        expr: sis_library_dictionary_builder_check_success{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Authenticated dev Dictionary Builder provider check failed

      - alert: DevLibraryDictionaryBuilderProvidersUnavailable
        expr: sis_library_dictionary_builder_definition_providers_checked{environment="dev"} > 0 and sis_library_dictionary_builder_definition_providers_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: No Dictionary Builder provider returned a definition in dev

      - alert: DevLibraryOldReviewQueue
        expr: sis_library_oldest_open_review_age_seconds{environment="dev"} > 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A dev Library contribution has waited for review for more than 24 hours

      - alert: DevLibraryDependencyUnavailable
        expr: sis_library_api_available{environment="dev"} == 0 or sis_library_database_available{environment="dev"} == 0 or sis_library_redis_available{environment="dev"} == 0 or sis_library_cmu_dictionary_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A required dev Library dependency is unavailable

      - alert: DevLibrarySyntheticCleanupFailed
        expr: sis_library_cleanup_success{environment="dev"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Dev Library workflow monitor could not clean up its synthetic record

  - name: sis-news-workflow-dev
    rules:
      - alert: DevNewsWorkflowMonitorStale
        expr: absent(sis_news_workflow_last_check_timestamp_seconds{environment="dev"}) or time() - sis_news_workflow_last_check_timestamp_seconds{environment="dev"} > 600
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Dev Student News workflow monitor has not reported for ten minutes

      - alert: DevNewsCheckFailed
        expr: sis_news_check_success{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Authenticated synthetic dev Student News Check failed

      - alert: DevNewsProviderUnavailable
        expr: sis_news_language_tool_available{environment="dev"} == 0 or sis_news_dictionary_available{environment="dev"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A required Student News validation provider is unavailable in dev

      - alert: DevNewsSubmissionFailed
        expr: sis_news_submission_failure{environment="dev"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Authenticated synthetic dev Student News submission failed

      - alert: DevNewsOldReviewQueue
        expr: sis_news_oldest_open_review_age_seconds{environment="dev"} > 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A dev Student News report has waited for review for more than 24 hours

      - alert: DevNewsSyntheticCleanupFailed
        expr: sis_news_cleanup_success{environment="dev"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Dev Student News workflow monitor could not remove its synthetic report

  - name: sis-test-mirror
    rules:
      - alert: TestMirrorPublicAdminDown
        expr: probe_success{job="blackbox-test-mirror"} < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Test mirror admin page is unavailable

      - alert: HostCpuHigh
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m]))) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage is above 85 percent

      - alert: HostMemoryLow
        expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host available memory is below 15 percent

  - name: public-website-availability
    rules:
      - alert: PublicWebsiteDown
        expr: probe_success{job="blackbox-website-http",check="main"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.domain }} is down"
          description: "The public HTTPS check {{ $labels.instance }} has failed for at least two minutes."

      - alert: PublicWebsiteProbeTargetMissingEaglesEdu
        expr: absent(probe_success{job="blackbox-website-http",domain="eagles.edu.vn",check="main"})
        for: 2m
        labels:
          domain: eagles.edu.vn
          severity: critical
        annotations:
          summary: "The eagles.edu.vn public probe is missing"
          description: "Prometheus no longer has the expected apex-site probe series."

      - alert: PublicWebsiteProbeTargetMissingAdmin
        expr: absent(probe_success{job="blackbox-website-http",domain="admin.eagles.edu.vn",check="main"})
        for: 2m
        labels:
          domain: admin.eagles.edu.vn
          severity: critical
        annotations:
          summary: "The admin.eagles.edu.vn public probe is missing"
          description: "Prometheus no longer has the expected admin-site probe series."

      - alert: PublicWebsiteProbeTargetMissingLtd
        expr: absent(probe_success{job="blackbox-website-http",domain="ltd.eagles.vn",check="main"})
        for: 2m
        labels:
          domain: ltd.eagles.vn
          severity: critical
        annotations:
          summary: "The ltd.eagles.vn public probe is missing"
          description: "Prometheus no longer has the expected LTD-site probe series."

      - alert: PublicWebsiteProbeTargetMissingIelts
        expr: absent(probe_success{job="blackbox-website-http",domain="ielts.eagles.edu.vn",check="main"})
        for: 2m
        labels:
          domain: ielts.eagles.edu.vn
          severity: critical
        annotations:
          summary: "The ielts.eagles.edu.vn public probe is missing"
          description: "Prometheus no longer has the expected IELTS-site probe series."

      - alert: PublicWebsiteProbeTargetMissingThuvien
        expr: absent(probe_success{job="blackbox-website-http",domain="thuvien.eagles.edu.vn",check="main"})
        for: 2m
        labels:
          domain: thuvien.eagles.edu.vn
          severity: critical
        annotations:
          summary: "The thuvien.eagles.edu.vn public probe is missing"
          description: "Prometheus no longer has the expected Thuvien-site probe series."

      - alert: PublicWebsiteProbeScrapeFailed
        expr: up{job=~"blackbox-website-http|blackbox-website-app|blackbox-thuvien-media"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Website probe collection failed for {{ $labels.domain }}"
          description: "Prometheus cannot collect the {{ $labels.check }} probe for {{ $labels.domain }}."

      - alert: PublicWebsiteCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-website-http",check="main"} - time() < 1209600) and (probe_ssl_earliest_cert_expiry{job="blackbox-website-http",check="main"} > time())
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate for {{ $labels.domain }} expires within 14 days"
          description: "The public HTTPS probe reports a certificate with less than 14 days remaining."

      - alert: PublicWebsiteResponseSlow
        expr: probe_duration_seconds{job="blackbox-website-http",check="main"} > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.domain }} is responding slowly"
          description: "The public HTTPS probe has taken over five seconds for at least five minutes."

      - alert: LTDERPNextApplicationCheckFailed
        expr: probe_success{job="blackbox-website-app",domain="ltd.eagles.vn",check="frappe-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "LTD ERPNext application API is unavailable"
          description: "The public Frappe ping endpoint did not return its expected pong response."

      - alert: ThuvienMediaDeliveryFailed
        expr: probe_success{job="blackbox-thuvien-media",domain="thuvien.eagles.edu.vn"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Thuvien {{ $labels.check }} delivery is unavailable"
          description: "The public media route failed its one-byte HTTP range request."

      - alert: NodeExporterUnavailable
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host service monitoring is unavailable"
          description: "Prometheus cannot collect node-exporter service and host metrics."

      - alert: NginxServiceDown
        expr: (absent(node_systemd_unit_state{name="nginx.service",state="active"}) or node_systemd_unit_state{name="nginx.service",state="active"} != 1) and on() (up{job="node"} == 1)
        for: 2m
        labels:
          component: nginx
          severity: critical
        annotations:
          summary: "Nginx is down for the monitored websites"
          description: "The shared Nginx TLS and reverse-proxy service is not active."

      - alert: OpenLiteSpeedServiceDown
        expr: (absent(node_systemd_unit_state{name="lshttpd.service",state="active"}) or node_systemd_unit_state{name="lshttpd.service",state="active"} != 1) and on() (up{job="node"} == 1)
        for: 2m
        labels:
          component: openlitespeed
          severity: critical
        annotations:
          summary: "OpenLiteSpeed is down for sites that use it"
          description: "The shared OpenLiteSpeed upstream is not active."

      - alert: EaglesHomepageDatabaseDown
        expr: (absent(node_systemd_unit_state{name="mariadb.service",state="active"}) or node_systemd_unit_state{name="mariadb.service",state="active"} != 1) and on() (up{job="node"} == 1)
        for: 2m
        labels:
          component: mariadb
          domain: eagles.edu.vn
          severity: critical
        annotations:
          summary: "The eagles.edu.vn database service is down"
          description: "The host MariaDB service used by the apex site is not active."

      - alert: SISLiveApiServiceDown
        expr: (absent(node_systemd_unit_state{name="exercise-mailer.service",state="active"}) or node_systemd_unit_state{name="exercise-mailer.service",state="active"} != 1) and on() (up{job="node"} == 1)
        for: 2m
        labels:
          component: sis-api
          severity: critical
        annotations:
          summary: "The shared SIS live API service is down"
          description: "The SIS API serving admin, IELTS, and Thuvien routes is not active."

      - alert: ThuvienFlipImageGatewayDown
        expr: (absent(node_systemd_unit_state{name="thuvien-r2-flip-image.service",state="active"}) or node_systemd_unit_state{name="thuvien-r2-flip-image.service",state="active"} != 1) and on() (up{job="node"} == 1)
        for: 2m
        labels:
          component: flip-image-gateway
          domain: thuvien.eagles.edu.vn
          severity: critical
        annotations:
          summary: "Thuvien flip-book image gateway is down"
          description: "The local R2 image gateway service is not active."

      - alert: ThuvienReadAudioGatewayDown
        expr: (absent(node_systemd_unit_state{name="thuvien-read-audio.service",state="active"}) or node_systemd_unit_state{name="thuvien-read-audio.service",state="active"} != 1) and on() (up{job="node"} == 1)
        for: 2m
        labels:
          component: read-audio-gateway
          domain: thuvien.eagles.edu.vn
          severity: critical
        annotations:
          summary: "Thuvien reading audio gateway is down"
          description: "The local R2 audio gateway service is not active."

      - alert: LTDERPNextContainerMonitorStale
        expr: absent(erpnext_container_monitor_last_check_timestamp_seconds) or time() - erpnext_container_monitor_last_check_timestamp_seconds > 180 or erpnext_container_monitor_last_check_success == 0
        for: 1m
        labels:
          domain: ltd.eagles.vn
          severity: warning
        annotations:
          summary: "LTD ERPNext component monitor is stale or failed"
          description: "Prometheus has not received a successful inspection of the expected LTD ERPNext containers in three minutes."

      - alert: LTDERPNextContainerDown
        expr: erpnext_container_running{domain="ltd.eagles.vn"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LTD ERPNext {{ $labels.component }} container is down"
          description: "The expected LTD ERPNext container is not running."

      - alert: LTDERPNextContainerUnhealthy
        expr: erpnext_container_health{domain="ltd.eagles.vn"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "LTD ERPNext {{ $labels.component }} container is unhealthy"
          description: "A container health check reports unhealthy or the container is still starting."
