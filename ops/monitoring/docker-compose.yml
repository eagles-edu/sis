services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: sis-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=28d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../../runtime-data/prometheus/diagnostic-targets:/etc/prometheus/diagnostic-targets:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:9090:9090
  alertmanager:
    image: prom/alertmanager:v0.35.0
    container_name: sis-alertmanager
    restart: unless-stopped
    user: "1002:1002"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./.env.alertmanager-slack-webhook:/run/secrets/slack_webhook_url:ro
      - ../../runtime-data/prometheus/alertmanager:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
  grafana:
    image: grafana/grafana:12.1.1
    container_name: sis-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: 3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:3030:3000
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: sis-node-exporter
    restart: unless-stopped
    user: "0:0"
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/host/home/eagles/dockerz/sis/runtime-data/prometheus
      - --collector.systemd
      - --collector.processes
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /run/udev/data:/run/udev/data:ro
      - /run/systemd/private:/run/systemd/private
    ports:
      - 127.0.0.1:9100:9100

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.27.0
    container_name: sis-blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./blackbox.yml:/config/blackbox.yml:ro
    command:
      - --config.file=/config/blackbox.yml
    ports:
      - 127.0.0.1:9115:9115

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: sis-cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,cpu_topology,resctrl,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - 127.0.0.1:8089:8080

  loki:
    image: grafana/loki:3.7.8
    container_name: sis-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.21.3
    container_name: sis-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - 127.0.0.1:12345:12345
    depends_on:
      - loki

  # Optional: enable only while investigating host or application process load.
  process-exporter:
    image: ncabatoff/process-exporter:0.8.7
    container_name: sis-process-exporter
    restart: unless-stopped
    profiles: [diagnostics]
    pid: host
    command:
      - --procfs=/host/proc
      - --config.path=/config/process-exporter.yml
    volumes:
      - /proc:/host/proc:ro
      - ./process-exporter.yml:/config/process-exporter.yml:ro

  # Optional: exposes only on the host and reads the host's loopback Redis.
  redis-exporter:
    image: oliver006/redis_exporter:v1.80.1
    container_name: sis-redis-exporter
    restart: unless-stopped
    profiles: [diagnostics]
    network_mode: host
    environment:
      REDIS_ADDR: ${SIS_REDIS_EXPORTER_ADDR:-redis://127.0.0.1:6379}
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: 127.0.0.1:9121

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
