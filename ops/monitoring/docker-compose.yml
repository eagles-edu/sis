services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: sis-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../../runtime-data/prometheus/diagnostic-targets:/etc/prometheus/diagnostic-targets:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:9090:9090
  grafana:
    image: grafana/grafana:12.1.1
    container_name: sis-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: 3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:3030:3000
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: sis-node-exporter
    restart: unless-stopped
    user: "0:0"
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/host/home/eagles/dockerz/sis/runtime-data/prometheus
      - --collector.systemd
      - --collector.processes
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /run/udev/data:/run/udev/data:ro
      - /run/systemd/private:/run/systemd/private
    ports:
      - 127.0.0.1:9100:9100

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.27.0
    container_name: sis-blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./blackbox.yml:/config/blackbox.yml:ro
    command:
      - --config.file=/config/blackbox.yml
    ports:
      - 127.0.0.1:9115:9115

  # Optional: enable only while investigating host or application process load.
  process-exporter:
    image: ncabatoff/process-exporter:0.8.7
    container_name: sis-process-exporter
    restart: unless-stopped
    profiles: [diagnostics]
    pid: host
    command:
      - --procfs=/host/proc
      - --config.path=/config/process-exporter.yml
    volumes:
      - /proc:/host/proc:ro
      - ./process-exporter.yml:/config/process-exporter.yml:ro

  # Optional: exposes only on the host and reads the host's loopback Redis.
  redis-exporter:
    image: oliver006/redis_exporter:v1.80.1
    container_name: sis-redis-exporter
    restart: unless-stopped
    profiles: [diagnostics]
    network_mode: host
    environment:
      REDIS_ADDR: ${SIS_REDIS_EXPORTER_ADDR:-redis://127.0.0.1:6379}
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: 127.0.0.1:9121

volumes:
  prometheus-data:
  grafana-data:
