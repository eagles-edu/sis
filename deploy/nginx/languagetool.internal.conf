upstream sis_languagetool_upstream {
    server 127.0.0.1:8091 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8092 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 127.0.0.1:8093;
    server_name languagetool.internal;

    client_max_body_size 64k;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /v2/check {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_pass http://sis_languagetool_upstream;
    }
}
