docRoot                   $VH_ROOT/public_html
vhDomain                  $VH_NAME
vhAliases                 www.$VH_NAME
adminEmails               admin@eagles.edu.vn
enableGzip                1
enableIpGeo               1

index  {
  useServer               0
  indexFiles              index.php, index.html
}

errorlog $VH_ROOT/logs/$VH_NAME.error_log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog $VH_ROOT/logs/$VH_NAME.access_log {
  useServer               0
  logFormat               "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
  logHeaders              5
  rollingSize             10M
  keepDays                10
  compressArchive         1
}

scripthandler  {
  add                     lsapi:admin2005 php
}

extprocessor admin2005 {
  type                    lsapi
  address                 UDS://tmp/lshttpd/admin2005.sock
  maxConns                10
  env                     LSAPI_CHILDREN=10
  initTimeout             600
  retryTimeout            0
  persistConn             1
  pcKeepAliveTimeout      1
  respBuffer              0
  autoStart               1
  path                    /usr/local/lsws/lsphp82/bin/lsphp
  extUser                 admin2005
  extGroup                admin2005
  memSoftLimit            2047M
  memHardLimit            2047M
  procSoftLimit           400
  procHardLimit           500
}

extprocessor sis_api {
  type                    proxy
  address                 127.0.0.1:8787
  maxConns                200
  initTimeout             120
  retryTimeout            0
  respBuffer              0
}

phpIniOverride  {

}

module cache {
 storagePath /usr/local/lsws/cachedata/$VH_NAME
}

rewrite  {
 enable                  1
  autoLoadHtaccess        1
  rules                   RewriteRule ^/$ /admin/students [R=302,L]
RewriteRule ^/admin/?$ /admin/students [R=302,L]
RewriteRule ^/admin/students/?$ /sis-admin/student-admin.html [L]
RewriteRule ^/admin/students/.+$ /sis-admin/student-admin.html [L]
RewriteRule ^/api/exercise-submission/?$ http://sis_api/api/exercise-submission [P,L]
RewriteRule ^/api/student-intake-submission/?$ http://sis_api/api/student-intake-submission [P,L]
RewriteRule ^/api/(?:admin|sis-admin)/(.*)$ http://sis_api/api/admin/$1 [P,L]
RewriteRule ^/parent/portal/?$ http://sis_api/parent/portal [P,L]
RewriteRule ^/api/parent/(.*)$ http://sis_api/api/parent/$1 [P,L]
RewriteRule ^/student/portal/?$ http://sis_api/student/portal [P,L]
RewriteRule ^/api/student/(.*)$ http://sis_api/api/student/$1 [P,L]
}

context /.well-known/acme-challenge {
  location                /usr/local/lsws/Example/html/.well-known/acme-challenge
  allowBrowse             1

  rewrite  {
     enable                  0
  }
  addDefaultCharset       off

  phpIniOverride  {

  }
}

vhssl  {
  keyFile                 /root/.acme.sh/admin.eagles.edu.vn_ecc/admin.eagles.edu.vn.key
  certFile                /root/.acme.sh/admin.eagles.edu.vn_ecc/fullchain.cer
  certChain               1
  sslProtocol             24
  enableECDHE             1
  renegProtection         1
  sslSessionCache         1
  enableSpdy              15
  enableStapling          1
  ocspRespMaxAge          86400
}
