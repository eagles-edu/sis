---
name: Summarize new issues

on:
  push:
  issues:
    types: [opened]

concurrency:
  group: issue-summary-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  push-status:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Push trigger marker
        run: echo "Summary workflow push run is enabled; issue summarization remains issues-only."
