# Keep the shared service local to the host. nginx owns any remote TLS policy.
# The caller must send language=en-US: plain en disables English spell checking.
maxCheckTimeMillis=10000
maxTextLength=20000
maxCheckThreads=2
maxWorkQueueSize=32
cacheSize=2000
cacheTTLSeconds=300
pipelineCaching=true
maxPipelinePoolSize=8
pipelineExpireTimeInSeconds=300
